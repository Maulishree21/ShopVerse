<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — SHOPVERSE</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="auth-wrap">
  <div class="auth-media">
    <img src="https://images.unsplash.com/photo-1441986300917-64674bd600d8?w=900&h=1200&fit=crop" alt="Premium fashion and lifestyle products">
    <div class="auth-media-overlay">
      <a href="index.html" class="logo">SHOP<span>VERSE</span></a>
      <div class="auth-quote">
        <h2>Premium products. Seamless experience.</h2>
        <p>Sign in to pick up your cart, track your wishlist and keep shopping where you left off.</p>
      </div>
    </div>
  </div>

  <div class="auth-form-side">
    <div class="auth-card">
      <a href="index.html" class="back-home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        Back to shop
      </a>
      <h1>Welcome back</h1>
      <p class="sub">Sign in to continue shopping.</p>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="loginEmail">Email</label>
          <input type="email" id="loginEmail" placeholder="you@example.com" autocomplete="email">
          <div class="field-error" id="loginEmailError"></div>
        </div>
        <div class="form-group">
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" placeholder="Enter your password" autocomplete="current-password">
          <div class="field-error" id="loginPasswordError"></div>
        </div>
        <div class="form-row-between">
          <label class="checkbox-row">
            <input type="checkbox" id="rememberMe">
            Remember me
          </label>
          <a href="#">Forgot password?</a>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Sign In</button>
      </form>

      <p class="auth-footer-line">Don't have an account? <a href="signup.html">Create account</a></p>
    </div>
  </div>
</div>

<div class="toast" id="toast">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6 9 17l-5-5"/></svg>
  <span class="toast-text">Signed in</span>
</div>

<script src="script.js"></script>
</body>
</html>
